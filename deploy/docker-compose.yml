# Một file Compose cho Staging và Production. Môi trường tách biệt bằng file .env riêng
# và tên project riêng (dữ liệu, mạng, volume không dùng chung):
#   docker compose --env-file deploy/.env.staging    -f deploy/docker-compose.yml up -d --build
#   docker compose --env-file deploy/.env.production -f deploy/docker-compose.yml up -d --build
# Development dùng docker-compose.yml ở thư mục gốc.
name: ${COMPOSE_PROJECT_NAME:?Đặt COMPOSE_PROJECT_NAME, vd. th-staging}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    networks: [backend]

  # Lưu trữ S3-compatible tự host (SeaweedFS, Apache-2.0). Phase 1 chưa lưu file; sẵn sàng cho Phase 2.
  # Có thể thay bằng dịch vụ S3-compatible tại Việt Nam khi chi phí được duyệt.
  object-storage:
    image: chrislusf/seaweedfs:4.45
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    volumes:
      - s3data:/data
    networks: [backend]

  # Chạy migration bằng role chủ, sau đó cấp quyền cho role ứng dụng (RLS áp dụng cho role này)
  migrate:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: th-api:${IMAGE_TAG:-local}
    command: ["node", "scripts/migrate.mjs"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_OWNER_USER}:${POSTGRES_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    restart: "no"

  grant-app-role:
    image: postgres:16
    entrypoint: ["/db-init/01-app-role.sh"]
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./db-init:/db-init:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    restart: "no"

  api:
    image: th-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      API_PORT: 4000
    depends_on:
      grant-app-role: { condition: service_completed_successfully }
    networks: [backend, frontend]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args: { API_URL: "http://api:4000" }
    image: th-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on: [api]
    networks: [frontend]

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web, api]
    networks: [frontend]

  # Sao lưu hằng ngày vào thư mục riêng trên máy chủ. PHẢI chép tiếp sang vị trí độc lập (docs/operations.md).
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_OWNER_USER}
      PGPASSWORD: ${POSTGRES_OWNER_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["bash", "-c", "while true; do /scripts/backup-db.sh || echo 'BACKUP FAILED'; sleep 86400; done"]
    volumes:
      - ../scripts:/scripts:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

volumes:
  pgdata:
  redisdata:
  s3data:
  caddydata:

networks:
  backend:
  frontend:
