# Môi trường phát triển cục bộ. KHÔNG dùng cấu hình này cho production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: th
      POSTGRES_PASSWORD: th_dev_only
      POSTGRES_DB: th_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
